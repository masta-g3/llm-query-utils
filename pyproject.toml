[project]
name = "llm-query-utils"
version = "0.1.0"
description = "Minimal LLM query routing via Claude Agent SDK and LiteLLM/Instructor"
readme = "README.md"
authors = [
    { name = "Manuel Rueda", email = "manolorueda@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.50",
    "instructor>=1.4",
    "claude-agent-sdk>=0.1.30",
    "tokencost>=0.1.20",
    "pydantic>=2.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"
